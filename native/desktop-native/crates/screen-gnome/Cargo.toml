[package]
name = "t3-screen-gnome"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3-screen-gnome"
path = "src/main.rs"

[dependencies]
atspi = { version = "=0.30.0", default-features = false, features = [
  "connection",
  "proxies",
  "tokio",
] }
frame.workspace = true
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.4"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "process",
] }
xkbcommon = "=0.9.0"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
