[workspace]
members = ["crates/frame", "crates/desktop-frame", "crates/screen-gnome"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
frame = { path = "crates/frame" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
